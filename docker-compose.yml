services:
  db:
    image: postgres:12.1
    container_name: semesterly-db
    ports:
      - "5432:5432"

  web:
    image: semesterly
    container_name: semesterly-web
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=0
    build: .
    command: bash -c "python manage.py migrate; npm run watch & python /code/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - /code/node_modules
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      - db

  localssl:
    image: jhuopensource/semesterly-caddy
    container_name: semesterly-localssl
    logging:
      driver: none
    volumes:
      - ./build/caddy/Caddyfile:/etc/Caddyfile
    ports:
      - "443:443"
    depends_on:
      - web