# Runs the frontend linter, Prettier and ESLint
name: TSLint

on:
  push:
    branches: [prod, develop, feature/dark-mode-timetable]
  pull_request:
    branches: [prod, develop, feature/dark-mode-timetable]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stay on Node 14, disable built-in cache to avoid "Cache service responded with 400"
      - uses: actions/setup-node@v3
        with:
          node-version: 14.21.3

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run Prettier
        run: npx prettier "**/*.{js,jsx,ts,tsx}" --check

      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
