# Builds Semester.ly and runs tests
name: Semesterly CI

on:
  push:
    branches: [prod, develop, feature/dark-mode-timetable]
  pull_request:
    branches: [prod, develop, feature/dark-mode-timetable]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: [3.11]
        node-version: [22.x]   # or 20.x if you haven’t bumped yet

    steps:
      - name: Adjust hosts file
        run: sudo sh -c 'echo "127.0.0.1 jhu.sem.ly sem.ly jhu" >> /etc/hosts'

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ✅ Fix: install Chrome AND the matching ChromeDriver in one step
      - name: Setup Chrome + ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
          install-chromedriver: true

      # If your tests look for CHROME_BIN, export it:
      - name: Export CHROME_BIN (optional)
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - run: npm run build --if-present
      - run: npm run lint
      - run: npm run test

      - name: Run Backend Tests
        env:
          NODE_ENV: production
          host: jhu.sem.ly
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python manage.py test

      - name: Run docs
        run: make html -C docs
